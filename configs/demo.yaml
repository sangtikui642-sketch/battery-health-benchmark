  ],
  "feature_units": {
    "cycle_index": "dimensionless cycle index"
  },
  "models": [
    "linear_regression",
    "random_forest",
    "histogram_gradient_boosting"
  ],
  "model_random_seed": 73,
  "deterministic_tolerance": 1e-12
}
