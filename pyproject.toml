[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "battery-health-benchmark"
version = "0.1.0"
description = "A behavior-driven benchmark for battery state-of-health prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "typer>=0.12",
]

[project.scripts]
battery-health = "battery_health.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pytest>=8.2,<9",
    "pytest-bdd>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/battery_health"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["battery_health"]
