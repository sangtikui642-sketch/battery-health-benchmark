[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "battery-health-benchmark"
version = "0.2.0rc1"
description = "A behavior-driven benchmark for battery state-of-health prediction"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "赵一冰" },
]
keywords = ["battery", "benchmark", "machine-learning", "state-of-health"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "typer>=0.12",
]

[project.scripts]
battery-health = "battery_health.cli:app"

[project.urls]
Homepage = "https://github.com/sangtikui642-sketch/battery-health-benchmark"
Repository = "https://github.com/sangtikui642-sketch/battery-health-benchmark"
Issues = "https://github.com/sangtikui642-sketch/battery-health-benchmark/issues"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pytest>=8.2,<9",
    "pytest-bdd>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/battery_health"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["battery_health"]
